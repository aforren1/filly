name: Build wheels

# Every run builds and tests the wheels and the sdist. A pushed tag vX.Y.Z also publishes them to
# PyPI; the version comes from the tags (pyproject.toml). A manual run can publish to TestPyPI instead, to
# rehearse a release. Publishing uses PyPI trusted publishing: no token is stored here.
on:
  workflow_dispatch:
    inputs:
      testpypi:
        description: Publish the build to TestPyPI
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: ${{ matrix.os }} wheels
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # The tags, for the version.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Once, on the runner: in the manylinux container, git refuses the runner's checkout.
      - name: Compute the version
        shell: bash
        run: |
          python -m pip install 'setuptools-scm>=9'
          version=$(python -m setuptools_scm)
          if [[ $GITHUB_REF == refs/tags/v* && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Version $version does not match the tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=$version" | tee -a "$GITHUB_ENV"
      - name: Cache Linux SDK
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: .deps/filament-linux
          key: filament-linux-x86_64-manylinux228-${{ hashFiles('tools/build_filament_linux.py', 'tools/ci_linux.sh') }}
      - name: Cache Windows SDK
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: .deps
          key: filament-windows-x86_64-${{ hashFiles('tools/fetch_filament.py') }}
      - name: Cache macOS SDK
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: .deps
          key: filament-macos-arm64-${{ hashFiles('tools/fetch_filament.py') }}
      - name: Build, repair, audit, and test wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: 'cp310-* cp311-* cp312-* cp313-* cp314-*'
          CIBW_SKIP: '*-musllinux* *-win32 *-win_arm64'
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_WINDOWS: AMD64
          # The Filament release archive for macOS has arm64 libraries only.
          CIBW_ARCHS_MACOS: arm64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: bash {package}/tools/ci_linux.sh
          CIBW_BEFORE_ALL_WINDOWS: python {package}/tools/fetch_filament.py
          CIBW_BEFORE_ALL_MACOS: python {package}/tools/fetch_filament.py
          CIBW_ENVIRONMENT_PASS_LINUX: SETUPTOOLS_SCM_PRETEND_VERSION
          CIBW_ENVIRONMENT_LINUX: 'CC=clang CXX=clang++ CMAKE_ARGS="-DFILAMENT_ROOT=/project/.deps/filament-linux" LIBGL_ALWAYS_SOFTWARE=1'
          # The release archive's libraries are built for macOS 11.0 (LC_BUILD_VERSION minos).
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
          CIBW_TEST_REQUIRES: 'pytest pillow pyglet==1.4.11'
          CIBW_TEST_COMMAND_LINUX: 'timeout 600 xvfb-run -a python -m pytest {project}/python/tests -q -m "not psychopy" -o faulthandler_timeout=60'
          # Hosted Windows runners do not supply a reliable OpenGL rendering device.
          CIBW_TEST_COMMAND_WINDOWS: 'python -m pytest {project}/python/tests/test_stress.py {project}/python/tests/test_native_imports.py -q'
          # Hosted macOS runners are Apple silicon VMs with a paravirtual Metal GPU, on which
          # Apple's OpenGL runs, so the offscreen suite needs no window server. The shared-context
          # tests need a pyglet window from the window server, which hosted runners do not
          # promise, and pyglet 1.4.11 does not load on arm64; run them on a Mac
          # (docs/how-to/build.md).
          CIBW_TEST_REQUIRES_MACOS: 'pytest pillow'
          CIBW_TEST_COMMAND_MACOS: 'python -m pytest {project}/python/tests -q -m "not psychopy and not interop" -o faulthandler_timeout=60'
      - name: Check extension imports
        shell: bash
        run: python tools/check_native_imports.py wheelhouse/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # The tags, for the version.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compute the version
        run: |
          python -m pip install 'setuptools-scm>=9'
          version=$(python -m setuptools_scm)
          if [[ $GITHUB_REF == refs/tags/v* && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Version $version does not match the tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=$version" | tee -a "$GITHUB_ENV"
      - name: Build the sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/filly
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [wheels, sdist]
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/filly
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
