name: MATLAB and Octave

# Builds the MEX gateway for MATLAB on Windows and Linux and for Octave on Linux, checks the
# libraries and symbols of each file, and runs the frontend tests:
# - Windows, MATLAB: the tests that need no renderer. Hosted Windows runners do not supply a
#   reliable OpenGL rendering device.
# - Linux, MATLAB and Octave: the offscreen tests under Xvfb with Mesa's llvmpipe.
# - Linux, Octave: the Psychtoolbox tests with Ubuntu's Psychtoolbox, under Xvfb with Mesa's Zink
#   driver on lavapipe. Psychtoolbox crashes in Screen('OpenWindow') with llvmpipe under Xvfb.
# The parity tests and the Psychtoolbox tests in MATLAB run on a machine with a GPU
# (docs/how-to/matlab.md).
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: matlab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: windows-2022 MATLAB
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # The same key as the wheel workflow, so that the two share one SDK download.
      - name: Cache Windows SDK
        uses: actions/cache@v6
        with:
          path: .deps
          key: filament-windows-x86_64-${{ hashFiles('tools/fetch_filament.py') }}
      - name: Fetch the Filament SDK
        run: python tools/fetch_filament.py
      - id: matlab
        uses: matlab-actions/setup-matlab@v3
        with:
          # The release that the local rendering and PTB tests ran on.
          release: R2023a
          cache: true
      - name: Build the MEX file
        shell: bash
        run: |
          cmake -S . -B build/matlab -G "Visual Studio 17 2022" -A x64 -DFILLY_PYTHON=OFF -DFILLY_MATLAB=ON \
            -DMatlab_ROOT_DIR="${{ steps.matlab.outputs.matlabroot }}"
          cmake --build build/matlab --config Release --target filly_mex
      - name: Check MEX imports
        run: python tools/check_native_imports.py matlab/filly_mex.mexw64
      - name: Run the gateway tests
        uses: matlab-actions/run-command@v3
        with:
          command: cd matlab/tests; assert(run_tests('test_gateway*') == 0, 'filly:test', 'gateway tests failed')

  linux-sdk:
    name: Linux SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # The same key and path as the wheel workflow, so that both use one SDK build.
      - id: cache
        uses: actions/cache@v6
        with:
          path: .deps/filament-linux
          key: filament-linux-x86_64-manylinux228-${{ hashFiles('tools/build_filament_linux.py', 'tools/ci_linux.sh') }}
      # As in the wheel build: manylinux_2_28 and its C++ runtime. The static libraries also link
      # on ubuntu-24.04, whose glibc and libstdc++ are newer.
      - name: Build the SDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm -v "$PWD:/project" -w /project quay.io/pypa/manylinux_2_28_x86_64 bash tools/ci_linux.sh
          sudo chown -R "$(id -u):$(id -g)" .deps

  octave:
    name: ubuntu-24.04 Octave
    needs: linux-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          path: .deps/filament-linux
          key: filament-linux-x86_64-manylinux228-${{ hashFiles('tools/build_filament_linux.py', 'tools/ci_linux.sh') }}
          fail-on-cache-miss: true
      # Octave 8.4, Psychtoolbox 3.0.19, and Mesa from the Ubuntu archive. dbus: Psychtoolbox's
      # GameMode support aborts the process at exit without a session bus.
      - name: Install Octave, Psychtoolbox, and Mesa
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ninja-build clang octave octave-dev octave-psychtoolbox-3 \
            xvfb xauth mesa-vulkan-drivers libgl1-mesa-dri libegl1 libgl-dev libegl-dev libx11-dev dbus dbus-x11
      - name: Build the MEX file
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build/octave -G Ninja -DCMAKE_BUILD_TYPE=Release -DFILLY_PYTHON=OFF -DFILLY_OCTAVE=ON \
            -DFILAMENT_ROOT="$PWD/.deps/filament-linux"
          cmake --build build/octave --target filly_octave_mex
      - name: Check MEX libraries and exports
        run: python3 tools/check_native_imports.py matlab/filly_mex.mex
      - name: Run the offscreen tests (llvmpipe)
        working-directory: matlab/tests
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          timeout 900 xvfb-run -a -s "-screen 0 1024x768x24" \
            octave-cli --no-gui --no-init-file --quiet --eval "exit(run_tests() > 0)"
      - name: Run the Psychtoolbox tests (Zink on lavapipe)
        working-directory: matlab/tests/ptb
        env:
          MESA_LOADER_DRIVER_OVERRIDE: zink
          LIBGL_ALWAYS_SOFTWARE: '1'
          LIBGL_KOPPER_DRI2: '1'
        run: |
          timeout 1500 dbus-run-session -- xvfb-run -a -s "-screen 0 1024x768x24" \
            octave-cli --no-gui --no-init-file --quiet --eval "exit(run_ptb_tests() > 0)"

  matlab-linux:
    name: ubuntu-24.04 MATLAB
    needs: linux-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          path: .deps/filament-linux
          key: filament-linux-x86_64-manylinux228-${{ hashFiles('tools/build_filament_linux.py', 'tools/ci_linux.sh') }}
          fail-on-cache-miss: true
      - name: Install Xvfb and Mesa
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ninja-build clang xvfb xauth libgl1-mesa-dri libegl1 libgl-dev libegl-dev libx11-dev
      - id: matlab
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2023a
          cache: true
      - name: Build the MEX file
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build/matlab -G Ninja -DCMAKE_BUILD_TYPE=Release -DFILLY_PYTHON=OFF -DFILLY_MATLAB=ON \
            -DFILAMENT_ROOT="$PWD/.deps/filament-linux" -DMatlab_ROOT_DIR="${{ steps.matlab.outputs.matlabroot }}"
          cmake --build build/matlab --target filly_mex
      - name: Check MEX libraries and exports
        run: python3 tools/check_native_imports.py matlab/filly_mex.mexa64
      # run-command starts MATLAB itself, so the display comes from a server started here.
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      # MATLAB puts its own libstdc++ first in the library path. Mesa's drivers need the newer
      # system one (docs/how-to/matlab.md).
      - name: Run the offscreen tests (llvmpipe)
        uses: matlab-actions/run-command@v3
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LD_PRELOAD: /usr/lib/x86_64-linux-gnu/libstdc++.so.6
        with:
          command: cd matlab/tests; assert(run_tests() == 0, 'filly:test', 'offscreen tests failed')
