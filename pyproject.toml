[build-system]
requires = ["scikit-build-core>=0.11,<2", "nanobind>=2.4,<4"]
build-backend = "scikit_build_core.build"

[project]
name = "filly"
version = "0.2.0"
description = "A Python 3D renderer for glTF scenes, built on Google Filament"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex Forrence" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.22"]

[project.urls]
Homepage = "https://github.com/aforren1/filly"
Documentation = "https://github.com/aforren1/filly#readme"
Issues = "https://github.com/aforren1/filly/issues"

[project.optional-dependencies]
# Floors are the oldest versions with the APIs filly uses: Image.Resampling (Pillow 9.1),
# Context.external_texture (moderngl 5.7), zengl 2's API (2.0 was never released).
examples = ["Pillow>=9.1"]
# Earlier PsychoPy standalone installs ship Python 3.8 or earlier.
psychopy = ["psychopy>=2024.2"]
pyglet = ["pyglet>=1.4.11"]
moderngl = ["pyglet>=1.4.11", "moderngl>=5.7"]
zengl = ["pyglet>=1.4.11", "zengl>=2.1"]

[dependency-groups]
dev = ["pytest>=8", "nanobind>=2.4,<4", "scikit-build-core>=0.11,<2", "ninja>=1.11"]

[tool.scikit-build]
minimum-version = "0.11"
cmake.version = ">=3.28"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/filly"]
wheel.py-api = "cp312"
sdist.exclude = [".deps", ".venv", "build", "dist", "Microsoft", ".vscode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a working OpenGL driver", "interop: requires a host WGL or GLX context", "psychopy: requires psychopy and a display", "browser: runs the web build in a browser (see tests/test_web.py)"]
